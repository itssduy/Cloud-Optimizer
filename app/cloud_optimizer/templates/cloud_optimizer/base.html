<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cloud Optimizer</title>
</head>
<body>
  {% if me %}
    <p>
      {{ me.email }} ({{ me.role }})
      <a href="{% url 'home' %}">Home</a>
      {% if me.role == "admin" %}<a href="{% url 'users' %}">Users</a>{% endif %}
      <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Log out</button></form>
    </p>
  {% endif %}
  {% for message in messages %}<p>{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
