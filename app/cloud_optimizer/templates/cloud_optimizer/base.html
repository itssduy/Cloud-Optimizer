<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cloud Optimizer{% endblock %}</title>
  {% block styles %}{% endblock %}
</head>
<body>
  {% block page %}
  {% if me %}
    <p>
      {{ me.email }} ({{ me.role }})
      <a href="{% url 'home' %}">Home</a>
      {% if me.role == "admin" %}<a href="{% url 'users' %}">Users</a>{% endif %}
      <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Log out</button></form>
    </p>
  {% endif %}
  {% for message in messages %}<p>{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
  {% endblock %}
</body>
</html>
